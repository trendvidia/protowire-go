name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: go version
        run: go version

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (check/protovalidate)
        run: go vet ./...
        working-directory: check/protovalidate

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: go test (check/protovalidate, race)
        run: go test -race -count=1 ./...
        working-directory: check/protovalidate

      - name: go test (coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...
      - name: run govulncheck (check/protovalidate)
        run: govulncheck ./...
        working-directory: check/protovalidate

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: run staticcheck
        run: staticcheck ./...
      - name: run staticcheck (check/protovalidate)
        run: staticcheck ./...
        working-directory: check/protovalidate

  fuzz:
    name: fuzz (smoke, ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./encoding/pxf
          - ./encoding/pb
          - ./encoding/sbe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      # A smoke run is a liveness check, not a search: it exists to catch
      # a crash a seed or a few seconds of mutation can reach. Its exit
      # code conflates two things — "found a reproducer" and "the
      # -fuzztime boundary closed untidily" (`context deadline exceeded`
      # with nothing written under testdata/fuzz/, #70) — and only the
      # first is a finding. The step therefore fails on a reproducer, or
      # on any failure that is not that exact boundary signature, and
      # demotes the boundary alone to a warning. Read the log before
      # rerunning: CONTRIBUTING.md § When CI Fails.
      - name: short fuzz run
        run: |
          echo "cores: $(nproc)"
          pkgdir="${{ matrix.pkg }}"
          tests=$(go test -list 'Fuzz.*' "$pkgdir" | grep '^Fuzz' || true)
          for t in $tests; do
            echo "=== $t ==="
            before=$(find "$pkgdir/testdata/fuzz" -type f 2>/dev/null | sort)
            if go test -run='^$' -fuzz="^${t}$" -fuzztime=15s "$pkgdir" 2>&1 | tee "fuzz-$t.log"; then
              continue
            fi
            after=$(find "$pkgdir/testdata/fuzz" -type f 2>/dev/null | sort)
            new=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after"))
            if [ -n "$new" ]; then
              echo "::error::$t found a reproducer:"
              echo "$new"
              exit 1
            fi
            if grep -q 'context deadline exceeded' "fuzz-$t.log"; then
              echo "::warning::$t hit the -fuzztime boundary (context deadline exceeded) with no reproducer — not a finding (#70)"
              continue
            fi
            echo "::error::$t failed without a reproducer and without the -fuzztime signature; read the log"
            exit 1
          done

  # Aggregate gate for branch protection: the "main protection — port" ruleset
  # requires this single context instead of enumerating matrix job names
  # (which change with every Go version bump and can never all be listed).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, vuln, staticcheck, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: all required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needs results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
